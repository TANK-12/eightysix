<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keymap</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/shared/forge.css">
<style>
  :root { --accent: #5fb0e0; --accent-2: #3f93c8; --on-accent: #06202b; }

  body { max-width: 1100px; margin: 0 auto; padding: 20px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .toolbar input[type="search"] {
    flex: 1; min-width: 200px; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 8px 10px;
  }
  .chip {
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px;
    background: var(--panel-2); color: var(--muted); cursor: pointer; font-size: 13px;
  }
  .chip.on { border-color: var(--accent); color: var(--text); background: rgba(95,176,224,0.15); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 8px 10px; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; }
  th.active { color: var(--text); }
  td { padding: 7px 10px; border-top: 1px solid var(--border); vertical-align: top; }
  tr:hover td { background: var(--panel-2); }

  .tag { display: inline-block; border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; margin: 1px 3px 1px 0; font-size: 11px; color: var(--muted); }
  .tag.universal { border-color: var(--accent); color: var(--accent); }

  .combo { font-family: monospace; }
  .combo-edit { display: flex; gap: 6px; align-items: center; }
  .combo-edit input { font-family: monospace; background: var(--panel-2); border: 1px solid var(--accent); color: var(--text); border-radius: 6px; padding: 4px 6px; width: 220px; }

  .generated-note { color: var(--muted); font-size: 12px; font-style: italic; }
  .src { color: var(--muted); font-size: 11px; }

  .count { color: var(--muted); font-size: 13px; }

  #history-panel table td, #history-panel table th { font-size: 13px; }

  /* long ~/.config paths wrap instead of pushing the table off the side */
  .src { overflow-wrap: anywhere; }
  .combo-edit { flex-wrap: wrap; }
  .combo-edit input { max-width: 100%; }
  .combo-edit.saving { opacity: 0.6; pointer-events: none; transition: opacity 0.15s; }
  td.state { padding: 28px 10px; text-align: center; color: var(--muted); }
  td.state.bad { color: var(--warn); }
  tbody { transition: opacity 0.18s; }
  @media (max-width: 820px) {
    th, td { padding: 6px 6px; }
    .combo-edit input { width: 160px; }
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--muted); }
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
</style>
</head>
<body>

<header>
  <h1>Keymap</h1>
  <div class="mode-switch" id="tabs">
    <button data-tab="binds" class="on">Keybinds</button>
    <button data-tab="history">History</button>
  </div>
  <button id="go-fullscreen" class="btn">Fullscreen</button>
</header>

<div id="binds-panel">
  <div class="toolbar">
    <input type="search" id="search" placeholder="Filter by key combo or description...">
    <span id="scope-chips"></span>
    <span class="chip" id="chip-editable">Editable only</span>
  </div>
  <div class="count" id="count"></div>
  <table>
    <thead>
      <tr>
        <th data-sort="scopes">Scope</th>
        <th data-sort="key_display">Key combo</th>
        <th data-sort="description">Description</th>
        <th data-sort="file">Source</th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="4" class="state">Reading your keybinds…</td></tr></tbody>
  </table>
</div>

<div id="history-panel" class="hidden">
  <div class="count" id="history-count"></div>
  <table>
    <thead><tr><th>When</th><th>Action</th><th>Change</th><th>File</th><th></th></tr></thead>
    <tbody id="history-rows"></tbody>
  </table>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/shared/forge_chrome.js"></script>
<script src="/shared/forge.js"></script>
<script src="/shared/forge_idle.js"></script>
<script>
let allBinds = [];
let activeScopeFilters = new Set();
let editableOnly = false;
let sortKey = "scopes";
let sortDir = 1;

// A row across the whole table for loading, empty and error states.
function stateRow(tbody, cols, text, bad) {
  tbody.innerHTML = "";
  const tr = document.createElement("tr");
  const td = document.createElement("td");
  td.colSpan = cols;
  td.className = "state" + (bad ? " bad" : "");
  td.textContent = text;
  tr.appendChild(td);
  tbody.appendChild(tr);
}

// Returns false when the list could not be read, so the retry below backs off.
let bindsLoaded = false;
async function loadBinds() {
  let res;
  try {
    res = await fetch("/api/binds");
  } catch (e) {
    if (!bindsLoaded) stateRow(document.getElementById("rows"), 4, "The Keymap server is not answering. Trying again by itself…", true);
    else toast("The Keymap server is not answering", "err");
    return false;
  }
  if (!res.ok) {
    const msg = await errText(res, "Could not read the keybinds");
    if (!bindsLoaded) stateRow(document.getElementById("rows"), 4, msg, true);
    else toast(msg, "err");
    return false;
  }
  const data = await res.json();
  allBinds = data.binds;
  bindsLoaded = true;
  buildScopeChips();
  renderRows();
  return true;
}

function allScopeLabels() {
  const set = new Set();
  for (const b of allBinds) for (const s of b.scopes) set.add(s);
  return [...set];
}

function buildScopeChips() {
  const container = document.getElementById("scope-chips");
  container.innerHTML = "";
  for (const label of allScopeLabels()) {
    const chip = document.createElement("span");
    chip.className = "chip" + (activeScopeFilters.has(label) ? " on" : "");
    chip.textContent = label;
    chip.onclick = () => {
      if (activeScopeFilters.has(label)) activeScopeFilters.delete(label);
      else activeScopeFilters.add(label);
      buildScopeChips();
      renderRows();
    };
    container.appendChild(chip);
  }
}

document.getElementById("chip-editable").onclick = (e) => {
  editableOnly = !editableOnly;
  e.target.classList.toggle("on", editableOnly);
  renderRows();
};

document.getElementById("search").addEventListener("input", renderRows);

for (const th of document.querySelectorAll("th[data-sort]")) {
  th.onclick = () => {
    const key = th.dataset.sort;
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
    for (const other of document.querySelectorAll("th[data-sort]")) other.classList.remove("active");
    th.classList.add("active");
    renderRows();
  };
}

function shortFile(path) {
  return path.replace(/^\/home\/[^/]+\//, "~/");
}

function sortValue(bind, key) {
  if (key === "scopes") return (bind.scopes[0] || "");
  if (key === "file") return bind.file;
  return bind[key] || "";
}

function renderRows() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  let rows = allBinds.filter((b) => {
    if (editableOnly && !b.editable) return false;
    if (activeScopeFilters.size && !b.scopes.some((s) => activeScopeFilters.has(s))) return false;
    if (q) {
      const hay = (b.key_display + " " + (b.description || "")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  rows = rows.slice().sort((a, b) => {
    const av = sortValue(a, sortKey), bv = sortValue(b, sortKey);
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });

  document.getElementById("count").textContent =
    `${rows.length} of ${allBinds.length} keybinds`;

  const tbody = document.getElementById("rows");
  if (!rows.length) {
    stateRow(tbody, 4, allBinds.length ? "No keybinds match this filter." : "No keybind files found under ~/.config/hypr.");
    return;
  }
  tbody.innerHTML = "";
  for (const b of rows) tbody.appendChild(renderRow(b));
}

function renderRow(bind) {
  const tr = document.createElement("tr");

  const scopeTd = document.createElement("td");
  for (const s of bind.scopes) {
    const tag = document.createElement("span");
    tag.className = "tag" + (s.startsWith("Universal") ? " universal" : "");
    tag.textContent = s;
    scopeTd.appendChild(tag);
  }

  const comboTd = document.createElement("td");
  comboTd.appendChild(renderCombo(bind));

  const descTd = document.createElement("td");
  descTd.textContent = bind.description || "";

  const srcTd = document.createElement("td");
  srcTd.className = "src";
  srcTd.textContent = `${shortFile(bind.file)}:${bind.line}`;

  tr.append(scopeTd, comboTd, descTd, srcTd);
  return tr;
}

function renderCombo(bind) {
  if (!bind.editable) {
    const span = document.createElement("span");
    span.className = "combo generated-note";
    span.textContent = bind.key_display + "  (generated — edit source)";
    return span;
  }

  const wrap = document.createElement("span");
  wrap.className = "combo";
  wrap.textContent = bind.key_display;
  wrap.title = "Click to edit";
  wrap.style.cursor = "pointer";
  wrap.onclick = () => startEdit(wrap, bind);
  return wrap;
}

function startEdit(el, bind) {
  const wrap = document.createElement("span");
  wrap.className = "combo-edit";

  const input = document.createElement("input");
  input.value = bind.key_display;

  const save = document.createElement("button");
  save.className = "btn btn-primary";
  save.textContent = "Save";
  save.onclick = () => submitEdit(bind, input.value, wrap, el);

  const cancel = document.createElement("button");
  cancel.className = "btn";
  cancel.textContent = "Cancel";
  cancel.onclick = () => wrap.replaceWith(el);

  // Enter saves, Escape puts the combo back as it was
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); save.click(); }
    else if (e.key === "Escape") { e.preventDefault(); cancel.click(); }
  });

  wrap.append(input, save, cancel);
  el.replaceWith(wrap);
  input.focus();
  input.select();
}

async function submitEdit(bind, newCombo, editEl, originalEl) {
  if (!newCombo.trim() || newCombo === bind.key_display) { editEl.replaceWith(originalEl); return; }

  // Preserve the source file's original quote style (' or ") rather than forcing one.
  const quote = bind.edit_old_text[0];
  const newText = quote + newCombo.replace(new RegExp(quote, "g"), "\\" + quote) + quote;

  const target = {
    file: bind.edit_file,
    line: bind.edit_line,
    old_text: bind.edit_old_text,
    new_text: newText,
    description: bind.description,
    scopes: bind.scopes,
  };

  // one save at a time: a second click or Enter while this one runs is ignored
  if (editEl.classList.contains("saving")) return;
  editEl.classList.add("saving");
  try {
    const res = await fetch("/api/binds/edit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ targets: [target] }),
    });
    if (!res.ok) { toast(await errText(res, "Edit failed"), "err"); return; }
    const data = await res.json();
    const result = data.results && data.results[0];
    if (!result || !result.ok) {
      toast((result && result.error) || "Edit failed", "err");
      return;
    }
    toast("Saved", "ok");
    await loadBinds();
  } catch (e) {
    toast("The Keymap server is not answering; nothing was saved", "err");
  } finally {
    editEl.classList.remove("saving");
  }
}

async function loadHistory() {
  const tbody = document.getElementById("history-rows");
  let data;
  try {
    const res = await fetch("/api/history");
    if (!res.ok) throw new Error(await errText(res, "Could not read the history"));
    data = await res.json();
  } catch (e) {
    stateRow(tbody, 5, e instanceof TypeError ? "The Keymap server is not answering. Open History again in a moment." : e.message, true);
    return;
  }
  tbody.innerHTML = "";
  document.getElementById("history-count").textContent = `${data.history.length} change${data.history.length === 1 ? "" : "s"}`;
  if (!data.history.length) stateRow(tbody, 5, "No edits yet. Changes made here show up with an Undo button.");
  for (const h of data.history) {
    const tr = document.createElement("tr");
    const when = document.createElement("td");
    when.textContent = new Date(h.timestamp * 1000).toLocaleString();
    const action = document.createElement("td");
    action.textContent = h.action;
    const change = document.createElement("td");
    change.className = "combo";
    change.textContent = `${h.old_text} → ${h.new_text}`;
    const file = document.createElement("td");
    file.className = "src";
    file.textContent = `${shortFile(h.file)}:${h.line}`;
    const undoTd = document.createElement("td");
    const undoBtn = document.createElement("button");
    undoBtn.className = "btn";
    undoBtn.textContent = "Undo";
    undoBtn.onclick = async () => {
      if (undoBtn.disabled) return;
      undoBtn.disabled = true;
      try {
        const r = await fetch(`/api/undo/${encodeURIComponent(h.id)}`, { method: "POST" });
        if (!r.ok) { toast(await errText(r, "Undo failed"), "err"); return; }
        toast("Reverted", "ok");
        await loadHistory();
        await loadBinds();
      } catch (e) {
        toast("The Keymap server is not answering; nothing was undone", "err");
      } finally {
        undoBtn.disabled = false;
      }
    };
    undoTd.appendChild(undoBtn);
    tr.append(when, action, change, file, undoTd);
    tbody.appendChild(tr);
  }
}

// The Keybinds / History switch. (The shared initTabs only wires "nav .tab",
// so with this page's .mode-switch the History tab never opened.)
function showTab(tab) {
  for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.tab === tab);
  document.getElementById("binds-panel").classList.toggle("hidden", tab !== "binds");
  document.getElementById("history-panel").classList.toggle("hidden", tab !== "history");
  if (tab === "history") loadHistory();
}
for (const b of document.querySelectorAll("#tabs button")) b.addEventListener("click", () => showTab(b.dataset.tab));

// Read the binds; if the server is not there yet, try again 2 s later,
// doubling to 30 s, only while the page is on screen, and stop once read.
const bindsPoll = ForgeIdle.poll(async () => {
  const ok = await loadBinds();
  if (ok) bindsPoll.stop();
  return ok;
}, 2000, { backoff: 2, maxMs: 30000, immediate: true });
</script>
</body>
</html>
