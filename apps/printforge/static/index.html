<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PrintForge</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/shared/forge.css">
<script type="importmap">
  { "imports": { "three": "/shared/vendor/three/three.module.min.js" } }
</script>
<style>
  :root { --accent: #e0a458; --accent-2: #c98a3c; --on-accent: #2b1a06; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-columns: 290px minmax(0, 1fr) 300px; grid-template-rows: auto minmax(0, 1fr); height: 100vh; overflow: hidden; }
  header { grid-column: 1 / 4; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; margin: 0; }
  header .tag { color: var(--muted); font-size: 13px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .modes { display: flex; gap: 4px; }
  #lib { overflow: auto; padding: 10px; border-right: 1px solid var(--border); }
  #lib input[type="search"] { width: 100%; box-sizing: border-box; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 9px; margin-bottom: 8px; }
  .proj { margin: 10px 0 4px; font-weight: 600; font-size: 13px; color: var(--text); }
  .fold { margin: 6px 0 2px 4px; font-size: 12px; color: var(--muted); }
  .file { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; color: var(--text); padding: 6px 8px; cursor: pointer; font-size: 13px; }
  .file:hover { background: var(--panel-2); }
  .file.on { border-color: var(--accent); background: rgba(224,164,88,0.12); }
  .file small { display: block; color: var(--muted); font-size: 11px; }
  #stage { position: relative; min-width: 0; }
  #view { position: absolute; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #toolbar { position: absolute; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 2; max-width: calc(100% - 20px); }
  #toolbar button, #toolbar select { font-size: 12px; }
  #status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted); font-size: 14px; text-align: center; pointer-events: none; max-width: 80%; animation: fadeIn 200ms ease-out; }
  #bar { width: 240px; height: 6px; background: var(--panel-2); border-radius: 3px; margin: 8px auto 0; overflow: hidden; display: none; }
  #bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  #info { overflow-y: auto; overflow-x: hidden; padding: 12px 12px 64px; border-left: 1px solid var(--border); font-size: 13px; }
  #info h2 { font-size: 15px; margin: 0 0 8px; word-break: break-all; }
  #info table { width: 100%; border-collapse: collapse; }
  #info td { padding: 3px 0; vertical-align: top; }
  #info td:first-child { color: var(--muted); width: 45%; }
  .badge { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; }
  .good { background: rgba(89,212,153,0.14); color: var(--good); }
  .bad { background: rgba(242,99,125,0.14); color: var(--bad); }
  #facts tr, #fitsBox .pair { animation: fadeIn 180ms ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--muted); }
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .file { transition: border-color 150ms ease, background-color 150ms ease; }
  button:disabled { opacity: 0.55; cursor: default; }
  /* Narrow: the check panel moves under the view so the view keeps its width. */
  @media (max-width: 980px) {
    body { grid-template-columns: 230px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) minmax(0, 42%); }
    header { grid-column: 1 / 3; }
    #lib { grid-row: 2 / 4; }
    #info { grid-column: 2; grid-row: 3; border-left: 0; border-top: 1px solid var(--border); padding-bottom: 56px; }
  }
  .section { margin-top: 14px; }
  .section h3 { font-size: 13px; margin: 0 0 6px; color: var(--muted); font-weight: 600; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatch { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--border); cursor: pointer; }
  .swatch.on { border-color: var(--accent); }
  .pair { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .pair label { width: 74px; flex: none; color: var(--muted); font-size: 12px; }
  .pair input[type="range"] { flex: 1; min-width: 0; }
  .pair input[type="number"] { width: 58px; flex: none; box-sizing: border-box; }
  textarea { width: 100%; box-sizing: border-box; min-height: 70px; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px; font-family: inherit; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>PrintForge</h1>
  <span class="tag">Look over 3D-print files before you slice them</span>
  <div class="modes"><button id="modeSimple" class="chip">Simple</button><button id="modeAdvanced" class="chip">Advanced</button></div>
</header>

<aside id="lib">
  <input id="search" type="search" placeholder="Search prints">
  <div id="files"><div class="hint">Looking for STL files</div></div>
  <div class="hint" id="rootsHint"></div>
</aside>

<main id="stage">
  <div id="view"></div>
  <div id="toolbar">
    <button data-view="iso">3/4</button>
    <button data-view="front">Front</button>
    <button data-view="right">Side</button>
    <button data-view="back">Back</button>
    <button data-view="top">Top</button>
    <button id="spin">Turntable</button>
    <button id="wire">Wireframe</button>
    <select id="bed"></select>
    <button id="bedToggle">Bed</button>
    <button id="shot" class="adv">Save picture</button>
  </div>
  <div id="status">Starting<div id="bar"><i></i></div></div>
</main>

<aside id="info">
  <h2 id="title">No print open</h2>
  <table id="facts"></table>
  <div class="section" id="fitsBox"></div>
  <div class="section">
    <h3>Colour</h3>
    <div class="swatches" id="swatches"></div>
  </div>
  <div class="section adv">
    <h3>Light</h3>
    <div class="pair"><label for="light">Brightness</label><input id="light" type="range" min="0.2" max="2.5" step="0.05"><input id="lightN" type="number" min="0.2" max="2.5" step="0.05"></div>
  </div>
  <div class="section adv">
    <h3>Custom bed (mm)</h3>
    <div class="pair"><label>Width</label><input id="bx" type="range" min="50" max="500" step="1"><input id="bxN" type="number" min="50" max="500"></div>
    <div class="pair"><label>Depth</label><input id="by" type="range" min="50" max="500" step="1"><input id="byN" type="number" min="50" max="500"></div>
    <div class="pair"><label>Height</label><input id="bz" type="range" min="50" max="500" step="1"><input id="bzN" type="number" min="50" max="500"></div>
    <button id="bedSave">Save as "custom"</button>
  </div>
  <div class="section adv">
    <h3>Folders searched (one per line)</h3>
    <textarea id="roots"></textarea>
    <button id="rootsSave">Save and rescan</button>
  </div>
  <div class="section">
    <button id="openFolder" disabled>Open folder</button>
    <div class="hint">Drag to turn, right-drag or Shift-drag to pan, scroll to zoom, double-click to fit.</div>
  </div>
</aside>

<div id="toast" class="toast hidden"></div>
<script src="/shared/forge.js"></script>
<script src="/shared/forge_idle.js"></script>
<script src="/shared/forge_chrome.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
