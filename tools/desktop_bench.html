<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>desktop bench</title>
<!-- tools/desktop_bench.py copies this page beside a shared/ folder (the old
     or the new desktop scripts) and drives it over the DevTools protocol.
     ?mode=particles&kind=embers | visual&style=orbit | widgets | all | depth[&app=1]
     &tier=reduced|paused stands in for the shared power tier -->
<link rel="stylesheet" href="shared/forge_widgets.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10131a; color: #eef1f6;
    font-family: "Rubik", "Inter", system-ui, sans-serif; --accent: #8ab4ff; --accent-2: #ff9ad5; }
  #particles, #visual { position: fixed; inset: 0; pointer-events: none; }
  #widgets { position: fixed; inset: 40px; }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<canvas id="visual"></canvas>
<div id="widgets" class="widgets"></div>
<script>
  const Q = new URLSearchParams(location.search), MODE = Q.get("mode") || "all";
  let HIDDEN = false;
  // ?tier=reduced|paused stands in for the shared power tier (shared/forge_power.js)

  Object.defineProperty(document, "hidden", { get: () => HIDDEN });
  Object.defineProperty(document, "visibilityState", { get: () => (HIDDEN ? "hidden" : "visible") });
  window.FORGE_THEME = { accent: "#8ab4ff", accent_2: "#ff9ad5", particle_fps: Number(Q.get("fps") || 60), particle_amount: 1,
    particles: MODE === "particles" || MODE === "all" ? Q.get("kind") || "embers" : "off", widgets: true,
    power_tier: Q.get("tier") || "full" };
  window.bench = { pf: 0, pms: 0, vf: 0, vms: 0, wf: 0, wms: 0, df: 0, dms: 0,
    reset() { Object.assign(this, { pf: 0, pms: 0, vf: 0, vms: 0, wf: 0, wms: 0, df: 0, dms: 0 }); },
    hide(on) { HIDDEN = !!on; document.dispatchEvent(new Event("visibilitychange")); } };
  // synthetic music: a beat on the lows and moving mids
  window.levels = () => {
    const t = performance.now() / 1000, v = new Float32Array(32), beat = Math.max(0, Math.sin(t * Math.PI * 2 * 2)) ** 4;
    for (let i = 0; i < 32; i++) v[i] = Math.min(1, (i < 4 ? 0.3 + beat * 0.6 : 0.15) + 0.25 * Math.abs(Math.sin(t * (1 + i * 0.13) + i)) * (1 - i / 40));
    return v;
  };
</script>
<script src="shared/forge_idle.js"></script>
<script src="shared/forge_particles.js"></script>
<script src="shared/forge_visual.js"></script>
<script src="shared/forge_widgets.js"></script>
<script>
  Particles.look = () => window.FORGE_THEME;
  const pframe = Particles.frame.bind(Particles);
  Particles.frame = (t) => { const a = performance.now(), before = Particles.drawn; pframe(t); if (Particles.drawn !== before) { bench.pf++; bench.pms += performance.now() - a; } };
  Particles.init();
  Particles.apply();
  // the page's own background visualiser, as the hub and desktop drive it
  if (MODE === "visual" || MODE === "all") {
    const cv = document.getElementById("visual"), st = {}, style = Q.get("style") || "orbit";
    let raf = 0;
    const frame = () => {
      raf = 0;
      if (document.hidden) return;
      if (cv.width !== innerWidth) cv.width = innerWidth;
      if (cv.height !== innerHeight) cv.height = innerHeight;
      const a = performance.now(), c = cv.getContext("2d");
      c.clearRect(0, 0, cv.width, cv.height);
      ForgeVisual.draw(c, cv.width, cv.height, style, levels(), { accent: "#8ab4ff", accent2: "#ff9ad5", st });
      bench.vf++; bench.vms += performance.now() - a;
      raf = requestAnimationFrame(frame);
    };
    document.addEventListener("visibilitychange", () => { if (!document.hidden && !raf) raf = requestAnimationFrame(frame); });
    raf = requestAnimationFrame(frame);
  }
  // the 3D wallpaper (forge_depth.js) drifting, as on the home screen;
  // ?app=1 puts the page "behind an open app" (body.in-app)
  if (MODE === "depth") {
    const wall = document.createElement("div");
    wall.style.cssText = "position:fixed;inset:0";
    document.body.prepend(wall);
    const s = document.createElement("style");
    s.textContent = "canvas.depth{position:absolute;inset:0;width:100%;height:100%;display:block}";
    document.head.append(s);
    const go = () => {
      if (!ForgeDepth.mount(wall)) return;
      const draw = ForgeDepth.draw.bind(ForgeDepth);
      ForgeDepth.draw = (...a) => { const t = performance.now(); draw(...a); bench.df = (bench.df || 0) + 1; bench.dms = (bench.dms || 0) + performance.now() - t; };
      ForgeDepth.set({ strength: 1, drift: true, tier: window.FORGE_THEME.power_tier });
      ForgeDepth.load("wall.jpg", "depth.png", null).then(() => { if (Q.get("app")) document.body.classList.add("in-app"); });
    };
    const sc = document.createElement("script");
    sc.src = "shared/forge_depth.js";
    sc.onload = go;
    document.head.append(sc);
  }
  if (MODE === "widgets" || MODE === "all") {
    const W = ForgeWidgets;
    W.store = { load: () => null, save() {} };
    W.starterPages = () => [{ name: "Bench", items: [
      { kind: "clock", x: 0, y: 0, w: 3, h: 2 }, { kind: "system", x: 3, y: 0, w: 3, h: 2 },
      { kind: "network", x: 6, y: 0, w: 3, h: 2 }, { kind: "visualiser", x: 9, y: 0, w: 3, h: 2 },
      { kind: "calendar", x: 0, y: 2, w: 4, h: 4 }, { kind: "disk", x: 4, y: 2, w: 3, h: 2 }, { kind: "jan", x: 7, y: 2, w: 3, h: 2 },
    ] }];
    let n = 0;
    const stats = () => ({ cpu: 20 + (n++ % 40), mem: 55, battery: 72, charging: false, plugged: false, gpu: { level: 0, busy: 0.1, by: "" },
      net: { down: 120000 + (n % 9) * 30000, up: 20000, ifaces: ["wlan0"], wifi: "Home" },
      disks: [{ mount: "/", name: "System", used: 71, free_gb: 120.5, total_gb: 476.9 }], jan: { running: true, loaded: ["qwen3-4b"] } });
    const vdraw = ForgeVisual.draw.bind(ForgeVisual);
    ForgeVisual.draw = (...a) => { const t = performance.now(), r = vdraw(...a); bench.wf++; bench.wms += performance.now() - t; return r; };
    W.theme = window.FORGE_THEME;
    W.mount(document.getElementById("widgets"), { stats, levels: () => levels(), now: () => null, clock24: () => true });
  }
</script>
</body>
</html>
