<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Eighty Six sound review</title>
<style>
:root { --bg: #11151a; --panel: #1b222b; --line: #2c3642; --text: #e6e9ec; --dim: #9aa6b2;
  --keep: #5fbf7a; --drop: #d9655b; --accent: #d9a441; }
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); }
header { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 12px 20px; display: flex; gap: 16px; align-items: center; z-index: 2; }
h1 { font-size: 18px; margin: 0; font-weight: 600; }
.count { color: var(--dim); }
button { background: #26303b; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 12px; font: inherit; cursor: pointer; }
button:hover, button:focus-visible { border-color: var(--accent); outline: none; }
button.save { background: var(--accent); color: #1a1407; border-color: var(--accent); font-weight: 600; }
main { padding: 12px 20px 60px; max-width: 1100px; }
section { margin: 18px 0; }
h2 { font-size: 15px; margin: 0 0 6px; color: var(--accent); font-weight: 600; }
h2 small { color: var(--dim); font-weight: 400; margin-left: 8px; }
.row { display: grid; grid-template-columns: 170px 1fr auto 1fr; gap: 12px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin: 4px 0; }
.row.keep { border-left: 4px solid var(--keep); }
.row.drop { border-left: 4px solid var(--drop); opacity: 0.7; }
.name { color: var(--dim); font-family: ui-monospace, monospace; font-size: 13px; }
audio { width: 100%; height: 32px; }
.pick button { min-width: 64px; }
.pick button.on.k { background: var(--keep); color: #0d1a10; border-color: var(--keep); }
.pick button.on.d { background: var(--drop); color: #1f0c0a; border-color: var(--drop); }
input[type=text] { width: 100%; background: #141a21; color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; font: inherit; }
#status { color: var(--dim); margin-left: auto; }
</style></head><body>
<header><h1>Eighty Six sound review</h1><span class="count" id="count"></span>
<span id="status"></span><button class="save" id="save">Save review.json</button></header>
<main id="list"></main>
<script>
const FILES = [{"file": "in-game/sound_check_walk_sprint_fire_jump_1.wav", "group": "sound check walk sprint fire jump", "bus": "in-game", "source": "in-game"}, {"file": "synth/casing_57mm_drop_1.wav", "group": "57 mm casing hits the ground", "bus": "impacts", "source": "synth"}, {"file": "synth/casing_57mm_drop_2.wav", "group": "57 mm casing hits the ground", "bus": "impacts", "source": "synth"}, {"file": "synth/casing_57mm_drop_3.wav", "group": "57 mm casing hits the ground", "bus": "impacts", "source": "synth"}, {"file": "synth/casing_57mm_drop_4.wav", "group": "57 mm casing hits the ground", "bus": "impacts", "source": "synth"}, {"file": "synth/foot_dirt_1.wav", "group": "Juggernaut foot on dirt", "bus": "mech", "source": "synth"}, {"file": "synth/foot_dirt_2.wav", "group": "Juggernaut foot on dirt", "bus": "mech", "source": "synth"}, {"file": "synth/foot_dirt_3.wav", "group": "Juggernaut foot on dirt", "bus": "mech", "source": "synth"}, {"file": "synth/foot_dirt_4.wav", "group": "Juggernaut foot on dirt", "bus": "mech", "source": "synth"}, {"file": "synth/foot_rock_1.wav", "group": "Juggernaut foot on rock or concrete", "bus": "mech", "source": "synth"}, {"file": "synth/foot_rock_2.wav", "group": "Juggernaut foot on rock or concrete", "bus": "mech", "source": "synth"}, {"file": "synth/foot_rock_3.wav", "group": "Juggernaut foot on rock or concrete", "bus": "mech", "source": "synth"}, {"file": "synth/foot_rock_4.wav", "group": "Juggernaut foot on rock or concrete", "bus": "mech", "source": "synth"}, {"file": "synth/gun_57mm_fire_1.wav", "group": "57 mm main gun, fired", "bus": "weapons", "source": "synth"}, {"file": "synth/gun_57mm_fire_2.wav", "group": "57 mm main gun, fired", "bus": "weapons", "source": "synth"}, {"file": "synth/gun_57mm_fire_3.wav", "group": "57 mm main gun, fired", "bus": "weapons", "source": "synth"}, {"file": "synth/gun_57mm_reload_1.wav", "group": "57 mm autoloader cycle", "bus": "weapons", "source": "synth"}, {"file": "synth/gun_57mm_reload_2.wav", "group": "57 mm autoloader cycle", "bus": "weapons", "source": "synth"}, {"file": "synth/hydraulic_hiss_1.wav", "group": "Hydraulic vent (knee rams)", "bus": "mech", "source": "synth"}, {"file": "synth/hydraulic_hiss_2.wav", "group": "Hydraulic vent (knee rams)", "bus": "mech", "source": "synth"}, {"file": "synth/hydraulic_hiss_3.wav", "group": "Hydraulic vent (knee rams)", "bus": "mech", "source": "synth"}, {"file": "synth/impact_dirt_1.wav", "group": "Shell hits dirt", "bus": "impacts", "source": "synth"}, {"file": "synth/impact_dirt_2.wav", "group": "Shell hits dirt", "bus": "impacts", "source": "synth"}, {"file": "synth/impact_dirt_3.wav", "group": "Shell hits dirt", "bus": "impacts", "source": "synth"}, {"file": "synth/impact_metal_1.wav", "group": "Round hits armour", "bus": "impacts", "source": "synth"}, {"file": "synth/impact_metal_2.wav", "group": "Round hits armour", "bus": "impacts", "source": "synth"}, {"file": "synth/impact_metal_3.wav", "group": "Round hits armour", "bus": "impacts", "source": "synth"}, {"file": "synth/impact_rock_1.wav", "group": "Round hits rock or concrete", "bus": "impacts", "source": "synth"}, {"file": "synth/impact_rock_2.wav", "group": "Round hits rock or concrete", "bus": "impacts", "source": "synth"}, {"file": "synth/impact_rock_3.wav", "group": "Round hits rock or concrete", "bus": "impacts", "source": "synth"}, {"file": "synth/land_heavy_1.wav", "group": "Juggernaut lands from a jump", "bus": "mech", "source": "synth"}, {"file": "synth/land_heavy_2.wav", "group": "Juggernaut lands from a jump", "bus": "mech", "source": "synth"}, {"file": "synth/legion_servo_loop_1.wav", "group": "Legion machine whine (loop)", "bus": "mech", "source": "synth"}, {"file": "synth/legion_step_light_1.wav", "group": "Ameise or Grauwolf foot (Legion)", "bus": "mech", "source": "synth"}, {"file": "synth/legion_step_light_2.wav", "group": "Ameise or Grauwolf foot (Legion)", "bus": "mech", "source": "synth"}, {"file": "synth/legion_step_light_3.wav", "group": "Ameise or Grauwolf foot (Legion)", "bus": "mech", "source": "synth"}, {"file": "synth/legion_step_light_4.wav", "group": "Ameise or Grauwolf foot (Legion)", "bus": "mech", "source": "synth"}, {"file": "synth/lowe_fire_1.wav", "group": "L\u00f6we 120 mm gun, fired (Legion)", "bus": "weapons", "source": "synth"}, {"file": "synth/lowe_fire_2.wav", "group": "L\u00f6we 120 mm gun, fired (Legion)", "bus": "weapons", "source": "synth"}, {"file": "synth/mg_12_7_fire_1.wav", "group": "12.7 mm sub-arm gun, one shot", "bus": "weapons", "source": "synth"}, {"file": "synth/mg_12_7_fire_2.wav", "group": "12.7 mm sub-arm gun, one shot", "bus": "weapons", "source": "synth"}, {"file": "synth/mg_12_7_fire_3.wav", "group": "12.7 mm sub-arm gun, one shot", "bus": "weapons", "source": "synth"}, {"file": "synth/servo_loop_1.wav", "group": "Leg servos while moving (loop)", "bus": "mech", "source": "synth"}, {"file": "synth/skid_loop_1.wav", "group": "Feet skidding over gravel (loop)", "bus": "mech", "source": "synth"}, {"file": "synth/ui_back_1.wav", "group": "Menu back", "bus": "ui", "source": "synth"}, {"file": "synth/ui_click_1.wav", "group": "Menu click", "bus": "ui", "source": "synth"}, {"file": "synth/ui_confirm_1.wav", "group": "Menu confirm", "bus": "ui", "source": "synth"}, {"file": "synth/ui_hover_1.wav", "group": "Menu hover", "bus": "ui", "source": "synth"}, {"file": "synth/wind_loop_1.wav", "group": "Wind across the valley (loop)", "bus": "ambience", "source": "synth"}, {"file": "synth/wire_anchor_hit_1.wav", "group": "Wire anchor bites", "bus": "impacts", "source": "synth"}, {"file": "synth/wire_anchor_hit_2.wav", "group": "Wire anchor bites", "bus": "impacts", "source": "synth"}, {"file": "synth/wire_fire_1.wav", "group": "Wire anchor launched", "bus": "mech", "source": "synth"}, {"file": "synth/wire_fire_2.wav", "group": "Wire anchor launched", "bus": "mech", "source": "synth"}, {"file": "synth/wire_reel_loop_1.wav", "group": "Wire winch reeling (loop)", "bus": "mech", "source": "synth"}];
let review = {};
try { Object.assign(review, JSON.parse(localStorage.getItem("es86_review") || "{}")); } catch (e) {}
const list = document.getElementById("list");
const groups = {};
for (const f of FILES) (groups[f.group] = groups[f.group] || []).push(f);
for (const [g, files] of Object.entries(groups)) {
  const sec = document.createElement("section");
  sec.innerHTML = `<h2>${g}<small>${files[0].bus} · ${files[0].source}</small></h2>`;
  for (const f of files) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="name">${f.file.split("/").pop()}</span>
      <audio controls preload="none" src="${f.file}"></audio>
      <span class="pick"><button class="k">Keep</button> <button class="d">Drop</button></span>
      <input type="text" placeholder="Note (optional)">`;
    const [k, d] = row.querySelectorAll("button");
    const note = row.querySelector("input");
    const state = () => review[f.file] || "keep";
    const paint = () => {
      row.classList.toggle("keep", state() === "keep");
      row.classList.toggle("drop", state() === "drop");
      k.classList.toggle("on", state() === "keep");
      d.classList.toggle("on", state() === "drop");
      count();
    };
    k.onclick = () => { review[f.file] = "keep"; remember(); paint(); };
    d.onclick = () => { review[f.file] = "drop"; remember(); paint(); };
    note.value = review["note:" + f.file] || "";
    note.oninput = () => { review["note:" + f.file] = note.value; remember(); };
    paint();
    sec.appendChild(row);
  }
  list.appendChild(sec);
}
function remember() { localStorage.setItem("es86_review", JSON.stringify(review)); }
function count() {
  const drops = FILES.filter(f => (review[f.file] || "keep") === "drop").length;
  document.getElementById("count").textContent = `${FILES.length} takes · ${FILES.length - drops} kept · ${drops} dropped`;
}
document.getElementById("save").onclick = async () => {
  const body = JSON.stringify(review, null, 1);
  const status = document.getElementById("status");
  if (location.protocol.startsWith("http")) {
    const r = await fetch("review.json", { method: "POST", body });
    status.textContent = r.ok ? "Saved to assets/audio/review/review.json" : "Save failed";
  } else {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([body], { type: "application/json" }));
    a.download = "review.json"; a.click();
    status.textContent = "Downloaded: move it to assets/audio/review/";
  }
};
</script></body></html>
