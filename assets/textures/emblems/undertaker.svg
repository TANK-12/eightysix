<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="60 40 450 450">
  <!-- Undertaker: Shin's personal mark, a headless skeleton leaning on a planted shovel.
       One colour (black on clear), drawn bold like a stencil so it reads from a distance; the game
       tints and wears it (data/emblems.json). Edit freely: the game reads this file as it is. -->
  <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <!-- shovel planted in the ground: D grip, shaft -->
    <path d="M386 96 L386 384" stroke-width="22"/>
    <path d="M362 60 L410 60 L402 96 L370 96 Z" stroke-width="14"/>
    <!-- spine (vertebrae) and the neck stump where the head should be -->
    <path d="M256 100 L256 252" stroke-width="26" stroke-dasharray="18 7"/>
    <path d="M242 80 l28 0" stroke-width="16"/>
    <!-- collarbones -->
    <path d="M192 118 Q226 100 256 110 Q286 100 320 118" stroke-width="18"/>
    <!-- ribs -->
    <path d="M256 134 Q204 126 200 160 M256 134 Q308 126 312 160" stroke-width="17"/>
    <path d="M256 164 Q208 160 208 190 M256 164 Q304 160 304 190" stroke-width="17"/>
    <path d="M256 194 Q220 194 222 216 M256 194 Q292 194 290 216" stroke-width="16"/>
    <!-- pelvis -->
    <path d="M256 256 Q218 244 206 274 Q222 306 256 298 Q290 306 306 274 Q294 244 256 256 Z" stroke-width="18"/>
    <!-- left arm hanging -->
    <path d="M192 120 L172 192 L180 252" stroke-width="22"/>
    <path d="M180 252 l-10 22 m10 -22 l9 22 m-9 -22 l0 24" stroke-width="11"/>
    <!-- right arm bent, hand on the shovel's grip -->
    <path d="M320 120 L352 178 L376 108" stroke-width="22"/>
    <path d="M376 108 l18 -4 m-18 4 l14 12" stroke-width="11"/>
    <!-- legs, weight on the left, right knee bent -->
    <path d="M232 296 L222 380 L214 456 L180 466" stroke-width="24"/>
    <path d="M280 296 L308 374 L306 452 L340 462" stroke-width="24"/>
  </g>
  <g fill="#000">
    <!-- spade blade in the ground -->
    <path d="M358 380 L414 380 Q420 438 386 476 Q352 438 358 380 Z"/>
    <!-- joints -->
    <circle cx="222" cy="380" r="17"/><circle cx="308" cy="374" r="17"/>
    <circle cx="172" cy="192" r="15"/><circle cx="352" cy="178" r="15"/>
    <circle cx="192" cy="120" r="15"/><circle cx="320" cy="120" r="15"/>
    <!-- ground line -->
    <rect x="150" y="470" width="280" height="12" rx="6"/>
  </g>
</svg>
