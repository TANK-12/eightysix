<!doctype html><html><head><meta charset="utf-8"><title>an app behind another app</title>
<style>@keyframes spin { to { transform: rotate(360deg); } } #spinner { width: 20px; height: 20px; background: #88a7d3; animation: spin 1s linear infinite; }</style>
<script src="/shared/forge_chrome.js"></script></head>
<body><div id="spinner"></div>
<script>
// a normal animation loop, like a game or a canvas effect
window.frames = 0;
(function loop() { window.frames++; requestAnimationFrame(loop); })();
</script></body></html>
