<!doctype html><html><head><meta charset="utf-8"><title>child</title>
<style>#label { font-size: 14px; }</style></head>
<body><button id="go-fullscreen">Full screen</button><p id="label">Text size target</p>
<script>
// Counts element-fullscreen requests: inside the hub there must be none, as
// they lift the app over a black backdrop and hide the wallpaper.
window.fsCalls = 0;
document.documentElement.requestFullscreen = () => { window.fsCalls++; return Promise.resolve(); };
</script>
<script src="/shared/forge_chrome.js"></script>
</body></html>
