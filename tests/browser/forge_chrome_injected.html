<!doctype html><html><head><meta charset="utf-8"></head><body>
<p>An app with nowhere obvious to put a button.</p>
<script src="/shared/forge_chrome.js"></script>
<script>
addEventListener("load", () => setTimeout(() => {
  const out = [];
  const b = document.querySelector(".forge-chrome-btn");
  out.push((b ? "PASS" : "FAIL") + " :: a button is injected when the page has none");
  out.push((b && b.id === "go-fullscreen" ? "PASS" : "FAIL") + " :: injected button carries the standard id");
  out.push((b && b.textContent === "Full screen" ? "PASS" : "FAIL") + " :: injected button is labelled :: " + (b && b.textContent));
  const cs = b && getComputedStyle(b);
  out.push((cs && cs.position === "fixed" ? "PASS" : "FAIL") + " :: injected button is pinned :: " + (cs && cs.position + " " + cs.right + " " + cs.bottom));
  out.push((cs && cs.color !== cs.backgroundColor ? "PASS" : "FAIL") + " :: injected button is legible :: text " + (cs && cs.color) + " on " + (cs && cs.backgroundColor));
  if (b) b.click();
  out.push((document.body.classList.contains("forge-fullscreen") ? "PASS" : "FAIL") + " :: injected button toggles");
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  document.body.innerHTML = "<pre id='results'>RESULTS\n" + esc(out.join("\n")) + "\n</pre>";
}, 40));
</script></body></html>
